# Multi-role RL on a cluster of 2 nodes x 8 GPUs, trainers and rollout engines on separate GPUs
# (palingenesis.rl.pool). The layout below is what the planner prints for it:
#
#   pgs scenario plan --config configs/rl_scenario_cluster.yaml --params-b 4 --nodes 2 --gpus-per-node 8 \
#       --engine-gpus 8 --hosts node1,node2
#
#   trainers   GPUs 0-3 of each node: 8 ranks. One shared policy as LoRA adapters on a frozen base that every
#              rank holds whole (train.replicate_base): no collective in a rank's forward or backward, the
#              adapters' gradients summed once per step.
#   engines    GPUs 4-7 of each node: 8 vLLM engine workers, data-parallel replicas; rank r generates with
#              engines[r::8], which is on its own node.
#   sync       rank 0 sends every engine the adapters' factors (about 160 MB at rank 16 for 4B parameters, an
#              estimate; pool/push_mb measures it) while the trainers step; each engine folds them into its base
#              and applies the result between two of its steps. rollout.max_staleness bounds what is trained.
#
# On each node, one worker per engine GPU (the planner prints these lines):
#   CUDA_VISIBLE_DEVICES=4 python -m palingenesis.rl.pool.worker --model Qwen/Qwen3.5-4B --host 0.0.0.0 --port 7000
#   ... ports 7001-7003 for GPUs 5-7
# Then, from node1:
#   CUDA_VISIBLE_DEVICES=0,1,2,3 torchrun --nnodes 2 --nproc_per_node 4 --rdzv_backend c10d \
#       --rdzv_endpoint node1:29400 -m palingenesis.rl.trainer --config configs/rl_scenario_cluster.yaml
#
# Not run on any GPU yet: two trainer ranks sharing two engine workers are tested on CPU. Compare against
# rollout.backend vllm (an engine on every trainer GPU) and against train.replicate_base false (FSDP).

model:
  policy: Qwen/Qwen3.5-4B
  chat_template_kwargs: {enable_thinking: false}

data:
  dataset: data/ledger_sum.jsonl
  eval_dataset: data/ledger_sum_eval.jsonl

scenario:
  type: ledger_sum

roles:
  lead: {max_turns: 8, max_completion_tokens: 1024}
  worker: {max_new_tokens: 64}

lora:
  rank: 16
  alpha: 32

rollout:
  backend: remote
  engines: ["node1:7000", "node1:7001", "node1:7002", "node1:7003",
            "node2:7000", "node2:7001", "node2:7002", "node2:7003"]
  push: fold                       # the adapters' factors; each engine folds them into its base
  batch_prompts: 256               # the global batch: 32 per trainer rank
  group_size: 8
  max_new_tokens: 384
  max_completion_tokens: 1024
  max_model_len: 4096
  max_staleness: 2                 # an update lands within a step or two; older rows are dropped

loss:
  advantage_std: role
  advantage_std_floor: 0.05

train:
  output_dir: runs/scenario_cluster
  steps: 300
  learning_rate: 2.0e-5
  replicate_base: true
  eval_every: 25
  eval_samples: 512
  save_steps: 50

logging:
  dump_trajectories: 10
  dump_groups: 30
