# On-policy distillation, shared vocabulary: Qwen3.5-4B -> Qwen3.5-0.8B on GSM8K
# (non-thinking), vLLM rollouts, exact full-vocabulary reverse KL. One A100 80GB.
#
#   pgs distill --config configs/distill_qwen35.yaml
#
# Data: data/gsm8k_train.jsonl and data/gsm8k_test200.jsonl, as in configs/distill_math.yaml.

model:
  student: Qwen/Qwen3.5-0.8B
  chat_template_kwargs: {enable_thinking: false}

teachers:
  qwen35_4b:
    model: Qwen/Qwen3.5-4B        # hf backend: full distribution, so the loss is full_rkl

sources:
  gsm8k:
    format: messages
    path: data/gsm8k_train.jsonl
    dev_path: data/gsm8k_test200.jsonl
    max_new_tokens: 512

rollout:
  backend: vllm
  batch_prompts: 64               # 128: +16% tokens/s (larger decode batches), half the steps per token
  temperature: 1.0
  # Qwen3.5-0.8B needs little KV cache (6 of its 24 layers are full attention): a
  # small resident engine, no sleep/wake each step.
  gpu_memory_utilization: 0.1
  sleep: false
  max_model_len: 2048

train:
  output_dir: runs/distill_qwen35
  steps: 100
  learning_rate: 3.0e-6
  warmup_steps: 5
  score_micro_seqs: 16
  eval_every: 25
  eval_samples: 200
  save_steps: 25

logging:
  log_every: 1
  use_wandb: false
  project: palingenesis-opd
