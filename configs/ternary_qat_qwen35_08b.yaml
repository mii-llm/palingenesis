# Ternary quantisation-aware distillation of Qwen3.5-0.8B: every decoder linear and the tied embedding / head
# become alpha * {-1, 0, 1} (one alpha per 128 input weights), trained against the full-precision model.
#
#   pgs train --config configs/ternary_qat_qwen35_08b.yaml
#   pgs merge ternary --check runs/ternary/final        # the export is ternary: exit 0
#
# The baseline is the plugin's default quantiser (BitNet b1.58: absmean scale, round, identity estimator). Each
# variant is one changed line under plugins.custom[0].args or distill (see the Ternary QAT guide).
model:
  name_or_path: Qwen/Qwen3.5-0.8B
  torch_dtype: float32              # fp32 latent weights; the forward runs in bf16 (train.bf16)
  compile: false
data:
  # raw text, every token distilled; any jsonl / parquet with a text field, or chat rows (mode: sft)
  sources:
    - {dataset: data/corpus_en.jsonl, mode: pretrain, text_field: text}
    - {dataset: data/corpus_it.jsonl, mode: pretrain, text_field: text}
  max_seq_length: 1024
  streaming: false
train:
  output_dir: runs/ternary
  max_steps: 763                    # x 32,768 tokens per step = 25M tokens
  per_device_batch_size: 16
  gradient_accumulation_steps: 2
  learning_rate: 5.0e-5             # norms and other full-precision parameters
  min_learning_rate: 5.0e-6
  warmup_ratio: 0.05
  weight_decay: 0.0
  save_steps: 0
  seed: 42
distill:
  enabled: true
  divergence: forward_kl            # forward_kl | reverse_kl | jsd | skew_forward_kl | skew_reverse_kl | tvd
  temperature: 1.0
  ce_weight: 0.0                    # > 0 adds cross-entropy on the corpus tokens
  teachers:
    fp: {model: Qwen/Qwen3.5-0.8B, dtype: bfloat16}     # online teacher; add `cache: dir` for cached top-k targets
plugins:
  custom:
    - class: palingenesis.qat:TernaryQAT
      args:
        group_size: 128             # 0: one scale per tensor, -1: per output row
        scale: absmean              # absmean | absmax | twn | mse
        scale_mode: dynamic         # dynamic | frozen | learned (+ scale_lr)
        quantizer: round            # round | stochastic
        ste: identity               # identity | clipped | tanh (+ ste_sharpness ramp)
        quantize_embedding: true
        quantize_head: true
        latent_lr: 1.0e-4
        latent_eps: 1.0e-12
        clamp: 1.5
        export: folded
        save_latent: false          # true: also runs/ternary/final-latent/ (continue QAT, merge latents)
logging:
  use_wandb: false
  use_trackio: false
