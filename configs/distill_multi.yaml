# On-policy distillation from two teachers, one per prompt source: GSM8K prompts go
# to Qwen3-1.7B (same vocabulary as the student: full_rkl), chat prompts to
# SmolLM2-360M-Instruct (another tokenizer: xtok). Every step mixes both sources;
# metrics are reported per teacher (kl/<teacher>) and per source (eval/dev_kl/<source>).
# The chat teacher here is small to keep the example on one GPU; use a real one.
#
#   pgs distill --config configs/distill_multi.yaml
#
# Data: data/gsm8k_*.jsonl as in configs/distill_math.yaml, and data/chat_train.jsonl
# (chat prompts, e.g. the first user turns of HuggingFaceH4/ultrachat_200k).

model:
  student: Qwen/Qwen3-0.6B
  chat_template_kwargs: {enable_thinking: false}

teachers:
  math:
    model: Qwen/Qwen3-1.7B
  chat:
    model: HuggingFaceTB/SmolLM2-360M-Instruct

sources:
  gsm8k:
    path: data/gsm8k_train.jsonl
    dev_path: data/gsm8k_test200.jsonl
    teacher: math
    weight: 0.5
    max_new_tokens: 512
  chat:
    path: data/chat_train.jsonl
    dev_size: 100
    teacher: chat
    weight: 0.5
    max_new_tokens: 512

rollout:
  backend: vllm
  batch_prompts: 64
  temperature: 1.0
  gpu_memory_utilization: 0.3
  max_model_len: 2048

train:
  output_dir: runs/distill_multi
  steps: 60
  learning_rate: 3.0e-6
  warmup_steps: 5
  score_micro_seqs: 16
  eval_every: 20
  eval_samples: 200               # per source: the chat source holds out dev_size = 100

logging:
  log_every: 1
  use_wandb: false
  project: palingenesis-opd
