name: Quality and container

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
      - name: Install lightweight quality tools
        run: uv pip install --system ruff==0.8.6 pytest==9.0.2 PyYAML==6.0.3 yamllint==1.35.1
      - name: Install CPU PyTorch for configuration validation
        run: uv pip install --system torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: |
          ruff check .
          yamllint .github/workflows/container.yaml deploy/kubernetes .yamllint.yaml
      # The code base is formatted by hand to ruff's 120-column limit; report formatter drift without blocking.
      - name: Formatting (advisory)
        continue-on-error: true
        run: ruff format --check .
      - name: Lint Dockerfile
        # Debian packages receive security updates instead of fixed version pins.
        run: docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --ignore DL3008 - < Dockerfile
      - name: Validate deployment contracts and configuration
        # test_accelerator / test_muon_rocm cover the AMD/ROCm guards (CUDA-vs-ROCm
        # detection, FP8 refusal, quack). They monkeypatch torch's probes, so they run
        # on the CPU wheel here with no GPU.
        run: pytest -q tests/test_container_contract.py tests/test_config_validation.py tests/test_accelerator.py tests/test_muon_rocm.py

  container:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: palingenesis:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the installed wheel without a GPU
        run: |
          docker run --rm palingenesis:ci --help
          docker run --rm palingenesis:ci version
          docker run --rm --entrypoint python palingenesis:ci -c 'import torch, transformers, agent_tooling.diagnose; assert torch.version.cuda == "12.9"'
      - name: Run CPU training regression tests inside the image
        run: |
          docker run --rm --user 0 --entrypoint sh \
            -v "$PWD/tests:/tests:ro" -v "$PWD/configs:/configs:ro" palingenesis:ci -c \
            'python -m ensurepip && python -m pip install --no-cache-dir pytest==9.0.2 && python -m pytest -q -p no:cacheprovider /tests/test_train_loop.py /tests/test_checkpoint_optimizer.py /tests/test_right_padding_mask.py /tests/test_chunked_gated_losses.py'
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Reuse the tested build cache; pull requests never publish an image.
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
