[project]
name = "palingenesis"
version = "0.3.0"
description = "Fire-and-forget LLM fine-tuning with state-of-the-art defaults."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "palingenesis contributors" },
]
keywords = ["llm", "sft", "finetuning", "training", "pytorch", "palingenesis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Lower bounds, not exact pins: exact pins clash with whatever torch/CUDA build a
# machine already has. torch >= 2.11 is the tested lower bound (and what torchao, in
# the float8 extra, needs). transformers 5.x for the cache classes SeCO/DPO use and
# for Qwen3.5.
dependencies = [
    "torch>=2.11",
    "transformers>=5.12,<6",
    "datasets>=4.0",
    "accelerate>=1.10",
    "pyyaml>=6.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
# Core training (what you need to actually train)
train = [
    "liger-kernel>=0.5.0; sys_platform == 'linux'",   # Triton kernels: Linux only
    "bitsandbytes>=0.49",
    # Triton kernels for linear-attention layers (Qwen3.5, Qwen3-Next): without them
    # transformers runs a pure-torch fallback, ~6x slower at 2k tokens and ~20x at 32k.
    "flash-linear-attention>=0.4; sys_platform == 'linux'",
]
# CUDA causal convolution for linear-attention layers: a further ~25% on Qwen3.5, and
# required to pack Qwen3.5 sequences (it resets the convolution at document
# boundaries). Compiled against the environment's torch (see [tool.uv] below): allow
# a few minutes and nvcc. With pip: pip install causal-conv1d --no-build-isolation
hybrid = [
    "causal-conv1d>=1.5; sys_platform == 'linux'",
]
# Float8 training (memory.float8_training, H100/B200). Separate from `train` because
# transformers imports torchao on every model load once it is installed: on other GPUs
# that only costs import time and prints kernel-loading errors.
float8 = [
    "torchao>=0.9.0",
]
# vLLM rollouts and teachers for `pgs distill` (Linux + NVIDIA only). vLLM pins torch
# 2.11.0; both come from the CUDA 12.9 indexes below. torchvision, torchaudio and
# torchcodec are listed so that they come from that index too: PyPI's builds target
# CUDA 13 (torchcodec then fails to load on a CUDA 12 driver).
vllm = [
    "vllm==0.26.0; sys_platform == 'linux'",
    "torchvision==0.26.0; sys_platform == 'linux'",
    "torchaudio==2.11.0; sys_platform == 'linux'",
    "torchcodec>=0.14; sys_platform == 'linux'",
]
# pgs rl: symbolic answer checking for the math reward, and the Kubernetes Agent Sandbox client
rl = ["math-verify>=0.8"]
agent-sandbox = ["k8s-agent-sandbox[async]>=1.0"]
# MCP servers as RL environments (palingenesis.rl.envs.mcp)
mcp = ["mcp>=2.2"]
# rollout.backend vllm_server: vLLM's weight transfer into a running server imports ray
vllm-server = [
    "palingenesis[vllm]",
    "ray>=2.40; sys_platform == 'linux'",
]
# Logging backends
logging = [
    "trackio>=0.25.0",
    "wandb>=0.19.0",
]
# Advanced loss functions
loss = [
    "cut-cross-entropy>=25.1.0",
]
# Advanced optimizers
optim = [
    "schedulefree>=1.4.0",
]
# Data preparation (offline, not needed at train time)
prepare = [
    "sentence-transformers>=3.0.0",
]
# Everything
all = [
    "palingenesis[train,float8,logging,loss,optim,prepare,rl,mcp]",
]
# Development
dev = [
    "palingenesis[all]",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
palingenesis = "palingenesis.cli:main"
pgs = "palingenesis.cli:main"

[project.urls]
Repository = "https://github.com/mii-llm/palingenesis"
Documentation = "https://mii-llm.github.io/palingenesis/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# agent_tooling ships in the wheel so `pgs diagnose/inspect/validate/...`
# work from any directory, not just a source checkout.
packages = ["src/palingenesis", "agent_tooling"]

[tool.uv]
# causal-conv1d (hybrid extra) compiles CUDA code against the torch it will run with.
[tool.uv.extra-build-dependencies]
causal-conv1d = [{ requirement = "torch", match-runtime = true }, "ninja", "packaging", "wheel", "setuptools"]

# On Linux, torch comes from PyTorch's CUDA 12.9 index. PyPI's default Linux wheels
# target the newest CUDA (torch 2.14: CUDA 13.0, NVIDIA driver >= 580); on an older
# driver they install fine and then see no GPU. cu129 runs on drivers >= 575, and it is
# the CUDA build vLLM 0.26 publishes for torch 2.11 (there is no cu128 one).
# macOS/Windows keep PyPI's build. Other CUDA versions: see the installation guide.
[tool.uv.sources]
torch = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]
torchcodec = [{ index = "pytorch-cu129", marker = "sys_platform == 'linux'" }]
vllm = [{ index = "vllm-cu129", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "vllm-cu129"
url = "https://wheels.vllm.ai/0.26.0/cu129"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
