[project]
name = "palingenesis"
version = "0.3.0"
description = "Fire-and-forget LLM fine-tuning with state-of-the-art defaults."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "palingenesis contributors" },
]
keywords = ["llm", "sft", "finetuning", "training", "pytorch", "palingenesis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Lower bounds, not exact pins: exact pins clash with whatever torch/CUDA build a
# machine already has. torch >= 2.11 because torchao (train extra, and imported by
# transformers whenever installed) needs it: with an older torch, model creation
# fails with "cannot import name 'ScalingType'". transformers 5.x for the cache
# classes SeCO/DPO use and for Qwen3.5.
dependencies = [
    "torch>=2.11",
    "transformers>=5.12,<6",
    "datasets>=4.0",
    "accelerate>=1.10",
    "pyyaml>=6.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
# Core training (what you need to actually train)
train = [
    "liger-kernel>=0.5.0; sys_platform == 'linux'",   # Triton kernels: Linux only
    "torchao>=0.8.0",
    "bitsandbytes>=0.49",
]
# Logging backends
logging = [
    "trackio>=0.25.0",
    "wandb>=0.19.0",
]
# Advanced loss functions
loss = [
    "cut-cross-entropy>=25.1.0",
]
# Advanced optimizers
optim = [
    "schedulefree>=1.4.0",
]
# Data preparation (offline, not needed at train time)
prepare = [
    "sentence-transformers>=3.0.0",
]
# Everything
all = [
    "palingenesis[train,logging,loss,optim,prepare]",
]
# Development
dev = [
    "palingenesis[all]",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
palingenesis = "palingenesis.cli:main"
pgs = "palingenesis.cli:main"

[project.urls]
Repository = "https://github.com/mii-llm/palingenesis"
Documentation = "https://mii-llm.github.io/palingenesis/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# agent_tooling ships in the wheel so `pgs diagnose/inspect/validate/...`
# work from any directory, not just a source checkout.
packages = ["src/palingenesis", "agent_tooling"]

[tool.uv]

# On Linux, torch comes from PyTorch's CUDA 12.8 index. PyPI's default Linux wheels
# target the newest CUDA (torch 2.14: CUDA 13.0, NVIDIA driver >= 580); on an older
# driver they install fine and then see no GPU. cu128 runs on drivers >= 570.
# macOS/Windows keep PyPI's build. Other CUDA versions: see the installation guide.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
